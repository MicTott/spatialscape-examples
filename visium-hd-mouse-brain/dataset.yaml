# Visium HD mouse brain at 8 um bins. The H&E and the scale (microns per pixel) come from the spatial/ folder
# next to the h5ad; the full-resolution scan is listed as a second image.
id: visium-hd-mouse-brain
name: Mouse brain, Visium HD (8 µm bins)
description: "One FFPE coronal section of mouse brain on Visium HD at 8 µm bins (10x Genomics public dataset), with graph clusters and the H&E."
default_gene: Slc17a7
default_color: { field: cluster }
layout: { mode: grid }
fields:
  - { id: cluster, name: Graph cluster (10x), type: categorical }
  - { id: total_counts, name: Total counts, type: continuous }
  - { id: detected_genes, name: Detected genes, type: continuous }
samples:
  - id: square_008um
    name: Mouse brain, 8 µm bins
    platform: visium_hd
    path: processed/square_008um/adata.h5ad
    fields: { cluster: cluster, total_counts: total_counts, detected_genes: detected_genes }
    images:
      - { id: he, name: H&E, path: raw/tissue_image.tif, pixel_size: auto, pixels_per_unit: 1.0, max_size: 12000 }   # the coordinates are full-resolution pixels of this scan
