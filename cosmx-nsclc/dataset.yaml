# CosMx SMI non-small-cell lung cancer (He et al. 2022): eight FFPE sections, 960 genes. Cells, the stitched composite
# image and the traced boundaries come from processed/ (prepare.py); the transcripts from the flat files in
# raw/. Coordinates are global pixels of 0.18 um; `translate` for each composite is what prepare.py printed.
id: cosmx-nsclc
name: Non-small-cell lung cancer, CosMx SMI
description: "Eight FFPE lung tumour sections from the CosMx SMI paper (He et al. 2022, 960-plex RNA): the paper's cell types and niches, every transcript with its compartment, cell boundaries traced from the segmentation masks, and the per-FOV composite images stitched into one picture per section."
default_gene: EPCAM
default_color: { field: cell_type }
layout: { mode: grid }

fields:
  - { id: cell_type, name: Cell type (He et al. 2022), type: categorical }
  - { id: niche, name: Niche (He et al. 2022), type: categorical }
  - { id: patient, name: Patient, type: categorical }
  - { id: total_counts, name: Transcripts per cell, type: continuous }
  - { id: area, name: "Cell area (µm²)", type: continuous }

defaults:
  platform: other
  microns: { microns_per_unit: 0.18 }
  point_radius: 5
  fields: { cell_type: cell_type, niche: niche, patient: patient, total_counts: total_counts, area: area }

samples:
  - id: lung5_rep1
    name: Lung 5, replicate 1
    path: processed/Lung5_Rep1/adata.h5ad
    polygons: { path: processed/Lung5_Rep1/cell_boundaries.parquet }
    # tx_file.csv: target, x_global_px / y_global_px, cell_ID (0 = unassigned, numbered within each FOV), CellComp (Nuclear / Cytoplasm / Membrane / 0)
    molecules: { path: raw/flat/Lung5_Rep1/Lung5_Rep1-Flat_files_and_images/Lung5_Rep1_tx_file.csv, feature_column: target, x_column: x_global_px, y_column: y_global_px, qv_column: null, cell_column: cell_ID, nucleus_column: CellComp }
    images:
      - { id: composite, name: "Composite (membrane, PanCK, CD45, CD3, DAPI)", path: processed/Lung5_Rep1/composite.tif, kind: rgb, pixel_size: 0.36, translate: [574.02, 25936.02] }
  - id: lung5_rep2
    name: Lung 5, replicate 2
